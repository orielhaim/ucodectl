pre-commit:
  parallel: true
  jobs:
    - name: rust-fmt
      glob: "**/*.rs"
      stage_fixed: true
      run: cargo fmt

    - name: rust-clippy
      glob: "**/*.rs"
      run: >
        cargo clippy --workspace --all-targets --all-features -- -D warnings &&
        cargo doc --workspace --all-features --no-deps --locked
